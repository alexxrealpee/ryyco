      #ryyco-shell .rs-logo { font-weight: 900; font-size: 22px; letter-spacing: 1px; color: #E63946; }
      #ryyco-shell .rs-hero { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 1100px; margin: 18px auto 0; padding: 16px; border-radius: 20px; background: linear-gradient(135deg, #103E31, #0B1A16); border: 1px solid rgba(255, 217, 138, .25); }

      #ryyco-shell p { font-size: 13px; color: #cbd5e1; margin: 0; }
      /* Igual o mayor que la imagen del hero de React (máx. 170 px en celular),
         para que el contenido principal (LCP) se mida desde el cascarón. */
      #ryyco-shell .rs-img { width: 180px; height: auto; flex: 0 0 auto; }
      @media (min-width: 640px) { #ryyco-shell .rs-img { width: 340px; } }
      #ryyco-shell .rs-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 1100px; margin: 18px auto 0; }
      #ryyco-shell .rs-card { height: 170px; border-radius: 16px; background: #111827; border: 1px solid #232B3A; animation: rs-pulse 1.4s ease-in-out infinite; }

      @keyframes rs-pulse { 50% { opacity: .55; } }
      html.rs-not-home #ryyco-shell .rs-hero, html.rs-not-home #ryyco-shell .rs-cards { display: none; }
